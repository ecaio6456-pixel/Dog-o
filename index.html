<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dogão do Paulista - Cardápio Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%AD%3C/text%3E%3C/svg%3E">
<style>
:root{--primary:#0098a6;--dark:#007782;--sec:#ff5722;--acc:#ffb300;--bg:#f4f8f9;--mut:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#1f2937;padding-bottom:120px}
header{background:linear-gradient(135deg,#0098a6,#00606b);color:#fff;padding:24px 16px 20px;text-align:center;border-radius:0 0 24px 24px;box-shadow:0 6px 20px rgba(0,152,166,.25)}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:20px;font-size:.8rem;font-weight:700;margin-bottom:10px}
.badge.closed{background:#fee2e2;color:#991b1b}
.pulse{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
h1{font-family:'Fredoka',cursive;font-size:2.2rem;text-shadow:2px 2px 0 var(--sec);margin-bottom:4px}
.sub{font-size:.88rem;color:#e0f2fe;margin-bottom:14px}
.contact{display:flex;justify-content:center;gap:10px}
.contact a{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--dark);text-decoration:none;padding:6px 14px;border-radius:30px;font-size:.82rem;font-weight:700}
.banner{display:none;margin:14px 16px 0;padding:12px 14px;border-radius:12px;font-size:.85rem;font-weight:700;text-align:center}
#bClosed{background:#fee2e2;border:1px solid #fecaca;color:#991b1b}
#bNote{background:#fef3c7;border:1px solid #fde68a;color:#92400e;font-weight:600}
.search{padding:16px 16px 8px;position:relative}
.search i{position:absolute;left:30px;top:50%;transform:translateY(-35%);font-style:normal}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--bd);font-size:.95rem;outline:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;background:#fff;border:1px solid var(--bd);padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer}
.cat.active{background:var(--sec);border-color:var(--sec);color:#fff}
.sec{padding:0 16px 20px}
.sec h2{font-family:'Fredoka',cursive;font-size:1.3rem;color:var(--dark);margin-bottom:12px}
.grid{display:grid;gap:12px}
.card{background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);cursor:pointer}
.card h3{font-size:1rem;margin-bottom:4px}
.card p{font-size:.8rem;color:var(--mut);line-height:1.3;margin-bottom:8px}
.price{font-size:1.05rem;font-weight:800;color:var(--sec)}
.add{align-self:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;border:0;cursor:pointer}
body.closed .add,.card.off .add{background:#9ca3af}
body.closed .card{opacity:.85}
.card.off{opacity:.5}
.tag{font-size:.7rem;font-weight:800;color:#991b1b;background:#fee2e2;padding:2px 8px;border-radius:8px;margin-left:6px}
.float{position:fixed;bottom:16px;left:16px;right:16px;background:var(--dark);color:#fff;border-radius:18px;padding:12px 18px;display:none;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:900;cursor:pointer}
.cnt{background:var(--acc);color:#1f2937;padding:4px 10px;border-radius:12px;font-weight:800;margin-right:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-height:90vh;border-radius:24px 24px 0 0;padding:20px;overflow-y:auto}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
.sh b{font-size:1.25rem}
.x{background:#f3f4f6;border:0;width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer}
.fg{margin-bottom:14px}
label.l{font-size:.85rem;font-weight:700;margin-bottom:6px;display:block}
.in{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);font-size:.9rem;outline:none}
textarea.in{height:60px;resize:none}
.sw{display:flex;gap:8px;background:#f3f4f6;padding:4px;border-radius:12px;margin-bottom:14px}
.sw button{flex:1;padding:8px;font-size:.85rem;font-weight:700;border-radius:10px;border:0;background:transparent;cursor:pointer}
.sw button.on{background:#fff;color:var(--dark);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pay div{border:1px solid var(--bd);padding:10px 4px;border-radius:12px;text-align:center;font-size:.8rem;font-weight:700;cursor:pointer}
.pay div.on{border-color:var(--primary);background:#e0f7fa;color:var(--dark)}
.wa{background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:14px;font-weight:800;margin-top:10px;text-decoration:none;border:0;width:100%;cursor:pointer;font-size:1rem}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6}
.g2{display:grid;gap:8px}
.qty{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);font-size:1.2rem;background:#fff;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="badge" id="badge"><div class="pulse" id="pulse"></div><span id="badgeTxt">Verificando...</span></div>
  <h1>Dogão do Paulista</h1>
  <p class="sub">Lanches prensados e super recheados 🌭✨</p>
  <div class="contact">
    <a href="https://wa.me/5587988530881" target="_blank">💬 (87) 98853-0881</a>
    <a href="https://instagram.com/dogaodopaulista_" target="_blank">📸 @dogaodopaulista_</a>
  </div>
</header>
<div class="banner" id="bClosed">🔒 Estamos fechados no momento! O cardápio está em modo de visualização.</div>
<div class="banner" id="bNote"></div>
<div class="search"><i>🔍</i><input id="q" placeholder="Pesquisar lanche, combo, bebida..."></div>
<div class="cats" id="cats"></div>
<div id="menu"></div>

<div class="float" id="float" onclick="openCart()">
  <div style="display:flex;align-items:center"><span class="cnt" id="cnt">0</span><div><div style="font-weight:700">Ver Pedido</div><div style="font-size:.8rem;opacity:.9" id="cntTxt"></div></div></div>
  <div style="font-size:1.15rem;font-weight:800" id="barTotal"></div>
</div>

<div class="ov" id="pm"><div class="sheet">
  <div class="sh"><div><b id="pmT"></b><div style="font-size:.85rem;color:var(--mut);margin-top:4px" id="pmD"></div></div><button class="x" onclick="closeP()">✕</button></div>
  <div class="fg"><label class="l">Observações</label><textarea id="pmO" class="in" placeholder="Ex: Sem cebola, refrigerante Guaraná..."></textarea></div>
  <div class="qty"><button onclick="qty(-1)">-</button><b style="font-size:1.3rem" id="pmQ">1</b><button onclick="qty(1)">+</button></div>
  <button class="wa" style="background:var(--sec);justify-content:space-between" onclick="addCart()"><span>Adicionar</span><span id="pmP"></span></button>
</div></div>

<div class="ov" id="cm"><div class="sheet">
  <div class="sh"><b>Finalizar Pedido</b><button class="x" onclick="closeCart()">✕</button></div>
  <div id="items" style="max-height:160px;overflow-y:auto;margin-bottom:12px"></div>
  <div style="display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;padding:10px 0;border-top:2px dashed #e5e7eb;margin-bottom:12px"><span>Total dos Lanches:</span><span id="cmT" style="color:var(--sec)"></span></div>
  <label class="l">Forma de Recebimento:</label>
  <div class="sw"><button class="on" id="tD" onclick="setType('delivery')">🛵 Entrega</button><button id="tP" onclick="setType('pickup')">🏬 Retirada</button></div>
  <div class="fg"><label class="l">Seu Nome *</label><input id="name" class="in" placeholder="Ex: Maria Oliveira"></div>
  <div class="fg"><label class="l">Seu WhatsApp / Telefone *</label><input id="phone" type="tel" class="in" placeholder="Ex: (87) 99999-0000"></div>
  <div id="delivery">
    <div class="fg" style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><div><label class="l">Rua *</label><input id="street" class="in" placeholder="Ex: Rua das Flores"></div><div><label class="l">Número *</label><input id="num" class="in" placeholder="123"></div></div>
    <div class="fg" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="l">Bairro *</label><input id="bairro" class="in" placeholder="Ex: Centro"></div><div><label class="l">Referência</label><input id="ref" class="in" placeholder="Ex: Próximo à praça"></div></div>
  </div>
  <label class="l">Forma de Pagamento:</label>
  <div class="pay"><div class="on" data-p="PIX">⚡ Pix</div><div data-p="Cartão">💳 Cartão</div><div data-p="Dinheiro">💵 Dinheiro</div></div>
  <div class="fg" id="chg" style="display:none"><label class="l">Precisa de troco para quanto?</label><input id="troco" class="in" placeholder="Ex: R$ 50,00"></div>
  <a id="send" class="wa" href="#" target="_top" onclick="sendClick(event)">🟢 ENVIAR PEDIDO NO WHATSAPP</a>
</div></div>

<script>
const WA = "5587988530881";
// Mesmo endereço configurado no app do administrador:
const CLOUD_URL = "https://api.npoint.io/4fa149ca71a62061266b";

let _i = 0; const I = (name, desc, price) => ({ id: ++_i, name, desc, price, off: false });
const DOG = "Pão, salsicha, maionese, ketchup, mostarda, purê de batata, vinagrete", DX = ", milho, ervilha, cheddar, catupiry e batata palha.";
const DEFAULT_MENU = [
  { category: "Dog Lanches", items: [I("Dog Simples", DOG + " e batata palha.", 17), I("Dog Completo", DOG + DX, 19), I("Dog Super", DOG + DX + " (TUDO EM DOBRO)", 23)] },
  { category: "Calabresa", items: [I("Calabresa Simples", "Pão, linguiça toscana, maionese, vinagrete e ketchup.", 19), I("Calabresa Completo", "Pão, linguiça toscana, maionese, vinagrete, ketchup, cheddar e catupiry.", 21), I("Calabresa Super", "Pão, linguiça toscana, maionese, vinagrete, ketchup, cheddar e catupiry. (TUDO EM DOBRO)", 25)] },
  { category: "Calabresa de Frango", items: [I("Frango Simples", "Pão, linguiça toscana de frango, maionese, vinagrete e ketchup.", 19), I("Frango Completo", "Pão, linguiça toscana de frango, maionese, vinagrete, ketchup, cheddar e catupiry.", 21), I("Frango Super", "Pão, linguiça toscana de frango, maionese, vinagrete, ketchup, cheddar e catupiry. (TUDO EM DOBRO)", 25)] },
  { category: "Especiais & Kids", items: [I("Dog Kids", "Pão, salsicha, maionese, ketchup, mostarda e batata palha.", 11), I("Dog Misto", "Pão, salsicha, linguiça toscana, maionese, ketchup, mostarda, purê de batata, vinagrete" + DX, 23)] },
  { category: "Batata Frita", items: [I("Batata Simples", "Só batata frita super crocante.", 14), I("Batata Completa", "Batata com catupiry e cheddar cremoso.", 16)] },
  { category: "Combos", items: [I("Combo Simples Dog", "Dog simples, batata simples, refrigerante lata ou suco.", 35), I("Combo Completo Dog", "Dog completo, batata com cheddar e catupiry, refrigerante lata ou suco.", 39), I("Combo Super Dog", "Dog super, batata com cheddar e catupiry, refrigerante lata ou suco.", 43), I("Combo Simples Calabresa", "Calabresa simples, batata simples, refrigerante lata ou suco.", 37), I("Combo Completo Calabresa", "Calabresa completo, batata com cheddar e catupiry, refrigerante lata ou suco.", 41), I("Combo Super Calabresa", "Calabresa super, batata com cheddar e catupiry, refrigerante lata ou suco.", 45), I("Combo Misto", "Dog misto, batata com cheddar e catupiry, refrigerante lata ou suco.", 43)] },
  { category: "Bebidas", items: [I("Água Mineral 500ml", "Sem gás / Com gás bem gelada.", 3), I("Refrigerante Lata 350ml", "Coca-cola, Guaraná, etc.", 7), I("Refrigerante 1L", "Garrafa família bem gelada.", 10), I("Suco 450ml", "Suco natural e refrescante.", 7), I("H2O", "Garrafa H2OH! bem gelada.", 8)] }
];

let cfg = { mode: 'open', announcement: '', menu: DEFAULT_MENU };
let cart = [], cur = null, cq = 1, type = 'delivery', pay = 'PIX', activeCat = 'all', lastRaw = '';
const $ = id => document.getElementById(id);
const brl = n => 'R$ ' + n.toFixed(2).replace('.', ',');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isClosed = () => cfg.mode !== 'open';

async function loadCloud() {
  try {
    const res = await fetch(CLOUD_URL + '?nocache=' + Date.now(), { cache: 'no-store' });
    const raw = await res.text();
    if (raw === lastRaw) return;
    lastRaw = raw;
    const d = JSON.parse(raw);
    cfg.mode = d.mode === 'closed' ? 'closed' : 'open';
    cfg.announcement = d.announcement || '';
    cfg.menu = Array.isArray(d.menu) && d.menu.length ? d.menu : DEFAULT_MENU;
  } catch (e) { /* sem internet: mantém o último estado conhecido */ }
  applyStatus(); render();
}

function applyStatus() {
  const c = isClosed();
  document.body.classList.toggle('closed', c);
  $('badge').className = 'badge' + (c ? ' closed' : '');
  $('pulse').style.display = c ? 'none' : 'block';
  $('badgeTxt').textContent = c ? 'Fechado no Momento' : 'Aberto para Pedidos';
  $('bClosed').style.display = c ? 'block' : 'none';
  const n = (cfg.announcement || '').trim();
  $('bNote').style.display = n ? 'block' : 'none';
  $('bNote').innerHTML = '📢 <b>Aviso:</b> ' + esc(n);
}

function render() {
  const q = $('q').value.toLowerCase().trim();
  const data = cfg.menu.map((s, si) => ({ s, si, items: s.items.map((it, ii) => ({ it, ii })).filter(x => !q || x.it.name.toLowerCase().includes(q) || (x.it.desc || '').toLowerCase().includes(q)) })).filter(x => x.items.length);
  $('cats').innerHTML = `<button class="cat ${activeCat === 'all' ? 'active' : ''}" data-c="all">Todos</button>` + cfg.menu.map((s, i) => `<button class="cat ${activeCat === i ? 'active' : ''}" data-c="${i}">${esc(s.category)}</button>`).join('');
  $('menu').innerHTML = data.filter(x => activeCat === 'all' || x.si === activeCat).map(x => `
    <div class="sec"><h2>🌭 ${esc(x.s.category)}</h2><div class="grid">${x.items.map(({ it }) => `
      <div class="card ${it.off ? 'off' : ''}" data-id="${it.id}">
        <div><h3>${esc(it.name)}${it.off ? '<span class="tag">Esgotado</span>' : ''}</h3><p>${esc(it.desc || '')}</p><span class="price">${brl(+it.price)}</span></div>
        <button class="add">+</button>
      </div>`).join('')}</div></div>`).join('') || '<p style="text-align:center;color:var(--mut);padding:30px">Nada encontrado.</p>';
}

$('cats').onclick = e => { const b = e.target.closest('.cat'); if (!b) return; activeCat = b.dataset.c === 'all' ? 'all' : +b.dataset.c; render(); };
$('menu').onclick = e => { const c = e.target.closest('.card'); if (c) openP(+c.dataset.id); };
$('q').oninput = render;

function findItem(id) { for (const s of cfg.menu) { const f = s.items.find(i => i.id === id); if (f) return f; } }
function openP(id) {
  if (isClosed()) return alert('⚠️ O estabelecimento está fechado no momento para novos pedidos!');
  const it = findItem(id); if (!it) return;
  if (it.off) return alert('Este item está esgotado no momento.');
  cur = it; cq = 1; $('pmT').textContent = it.name; $('pmD').textContent = it.desc || ''; $('pmO').value = ''; upP(); $('pm').classList.add('on');
}
function closeP() { $('pm').classList.remove('on'); }
function qty(d) { cq = Math.max(1, cq + d); upP(); }
function upP() { $('pmQ').textContent = cq; $('pmP').textContent = brl(cur.price * cq); }
function addCart() {
  if (isClosed()) { closeP(); return alert('⚠️ O estabelecimento acabou de fechar para novos pedidos.'); }
  cart.push({ id: cur.id, name: cur.name, price: +cur.price, qty: cq, obs: $('pmO').value.trim() });
  closeP(); upBar();
}
function upBar() {
  $('float').style.display = cart.length ? 'flex' : 'none';
  const n = cart.reduce((a, i) => a + i.qty, 0), t = cart.reduce((a, i) => a + i.price * i.qty, 0);
  $('cnt').textContent = n; $('cntTxt').textContent = n + ' item(ns)'; $('barTotal').textContent = brl(t);
}
function openCart() { renderCart(); $('cm').classList.add('on'); }
function closeCart() { $('cm').classList.remove('on'); }
function renderCart() {
  let t = 0;
  $('items').innerHTML = cart.map((i, x) => { t += i.price * i.qty; return `<div class="row"><div><div style="font-size:.9rem;font-weight:700">${i.qty}x ${esc(i.name)}</div>${i.obs ? `<div style="font-size:.75rem;color:var(--mut)">↳ Obs: ${esc(i.obs)}</div>` : ''}<div style="font-size:.8rem;font-weight:700;color:var(--sec)">${brl(i.price * i.qty)}</div></div><button onclick="rm(${x})" style="background:none;border:0;color:#ef4444;font-size:1.1rem;cursor:pointer">🗑</button></div>`; }).join('') || '<p style="text-align:center;color:var(--mut);padding:16px">Carrinho vazio.</p>';
  $('cmT').textContent = brl(t);
}
function rm(i) { cart.splice(i, 1); renderCart(); upBar(); if (!cart.length) closeCart(); }
function setType(t) { type = t; $('tD').classList.toggle('on', t === 'delivery'); $('tP').classList.toggle('on', t === 'pickup'); $('delivery').style.display = t === 'delivery' ? 'block' : 'none'; }
document.querySelector('.pay').onclick = e => {
  const d = e.target.closest('[data-p]'); if (!d) return; pay = d.dataset.p;
  document.querySelectorAll('.pay div').forEach(x => x.classList.toggle('on', x === d));
  $('chg').style.display = pay === 'Dinheiro' ? 'block' : 'none';
};

function buildMsg() {
  const v = id => $(id).value.trim();
  if (!v('name')) return alert('Por favor, informe seu Nome.'), null;
  if (!v('phone')) return alert('Por favor, informe seu WhatsApp/Telefone.'), null;
  if (type === 'delivery' && (!v('street') || !v('num') || !v('bairro'))) return alert('Por favor, preencha Rua, Número e Bairro para entrega.'), null;
  let t = 0, m = `*NOVO PEDIDO - DOGÃO DO PAULISTA*\n\n👤 *Cliente:* ${v('name')}\n📱 *Contato:* ${v('phone')}\n🛵 *Tipo:* ${type === 'delivery' ? 'Entrega (Delivery)' : 'Retirada no Balcão'}\n`;
  if (type === 'delivery') { m += `📍 *Endereço:* ${v('street')}, Nº ${v('num')}\n🏘️ *Bairro:* ${v('bairro')}\n`; if (v('ref')) m += `📌 *Ponto de Ref:* ${v('ref')}\n`; }
  m += `\n📋 *ITENS ESCOLHIDOS:*\n`;
  cart.forEach(i => { t += i.price * i.qty; m += `• ${i.qty}x ${i.name} - ${brl(i.price * i.qty)}\n`; if (i.obs) m += `  ↳ Obs: ${i.obs}\n`; });
  m += `\n💰 *Total dos Lanches:* ${brl(t)}\n`;
  if (type === 'delivery') m += `🛵 *Taxa de Entrega:* (A combinar no WhatsApp)\n`;
  m += `💳 *Pagamento:* ${pay}`;
  if (pay === 'Dinheiro' && v('troco')) m += ` (Troco para ${v('troco')})`;
  return m;
}
function sendClick(e) {
  // O link é montado ANTES de navegar (sem await), para o WhatsApp abrir normalmente.
  if (!cart.length) { e.preventDefault(); return alert('Seu carrinho está vazio.'); }
  if (isClosed()) { e.preventDefault(); closeCart(); return alert('⚠️ O estabelecimento está fechado no momento para novos pedidos!'); }
  const m = buildMsg();
  if (!m) { e.preventDefault(); return; }
  $('send').href = `https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
  loadCloud();
}

applyStatus(); render(); loadCloud();
setInterval(loadCloud, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCloud(); });
</script>
</body>
</html>
