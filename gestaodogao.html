<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%AD%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<title>Dogão do Paulista - Administração</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0098a6;--dark:#007782;--sec:#ff5722;--bg:#f4f8f9;--mut:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{background:var(--bg);color:#1f2937;padding-bottom:90px}
header{background:linear-gradient(135deg,#0098a6,#00606b);color:#fff;padding:20px 16px;border-radius:0 0 24px 24px}
h1{font-family:'Fredoka',cursive;font-size:1.6rem}
header p{font-size:.85rem;opacity:.9}
.box{background:#fff;margin:14px 16px 0;padding:16px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.box h2{font-size:1.05rem;margin-bottom:10px}
.in{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);font-size:.9rem;outline:none}
textarea.in{resize:none;height:44px;font-size:.78rem;margin-top:6px}
.store{width:100%;padding:18px;border:0;border-radius:14px;font-size:1.1rem;font-weight:800;color:#fff;cursor:pointer}
.store.open{background:#16a34a}.store.closed{background:#dc2626}
.hint{font-size:.78rem;color:var(--mut);margin-top:8px}
.cat{font-family:'Fredoka',cursive;color:var(--dark);font-size:1.15rem;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.item{border-bottom:1px solid #f3f4f6;padding:10px 0}
.line{display:grid;grid-template-columns:1fr 84px;gap:6px}
.line2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.82rem;font-weight:700}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.8rem;cursor:pointer;background:#e0f7fa;color:var(--dark)}
.btn.red{background:#fee2e2;color:#991b1b}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.1);z-index:10}
.save{width:100%;padding:14px;border:0;border-radius:14px;background:var(--sec);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:12px;font-size:.85rem;font-weight:700;display:none;z-index:50;max-width:90%}
#login{max-width:340px;margin:18vh auto;text-align:center}
#app{display:none}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="login" class="box">
  <h1 style="color:var(--dark)">🔒 Administração</h1>
  <p class="hint" style="margin-bottom:12px">Digite a senha para continuar</p>
  <input class="in" id="pin" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')enter()">
  <button class="save" style="margin-top:12px" onclick="enter()">Entrar</button>
</div>

<div id="app">
  <header><h1>Painel do Dogão</h1><p>O que você alterar aqui aparece para os clientes em até 30 segundos.</p></header>

  <div class="box">
    <h2>Pedidos</h2>
    <button class="store open" id="storeBtn" onclick="toggleStore()"></button>
    <p class="hint">Fechada: clientes veem o cardápio mas não conseguem pedir.</p>
  </div>

  <div class="box">
    <h2>Aviso para os clientes</h2>
    <input class="in" id="note" placeholder="Ex: Hoje não temos calabresa de frango" oninput="S.announcement=this.value">
    <p class="hint">Deixe vazio para não mostrar aviso.</p>
  </div>

  <div class="box">
    <h2>Cardápio</h2>
    <div id="menu"></div>
    <button class="btn" style="margin-top:14px" onclick="addCat()">+ Nova categoria</button>
    <button class="btn red" style="margin-top:14px;margin-left:6px" onclick="resetMenu()">Restaurar cardápio original</button>
  </div>

  <div class="bar"><button class="save" onclick="save('Alterações salvas! ✅')">💾 Salvar alterações</button></div>
</div>

<script>
const ADMIN_PIN = "1234";   // <<< TROQUE ESTA SENHA
// Mesmo endereço configurado no app do cliente:
const CLOUD_URL = "https://api.npoint.io/4fa149ca71a62061266b";

let _i = 0; const I = (name, desc, price) => ({ id: ++_i, name, desc, price, off: false });
const DOG = "Pão, salsicha, maionese, ketchup, mostarda, purê de batata, vinagrete", DX = ", milho, ervilha, cheddar, catupiry e batata palha.";
const mk = () => { _i = 0; return [
  { category: "Dog Lanches", items: [I("Dog Simples", DOG + " e batata palha.", 17), I("Dog Completo", DOG + DX, 19), I("Dog Super", DOG + DX + " (TUDO EM DOBRO)", 23)] },
  { category: "Calabresa", items: [I("Calabresa Simples", "Pão, linguiça toscana, maionese, vinagrete e ketchup.", 19), I("Calabresa Completo", "Pão, linguiça toscana, maionese, vinagrete, ketchup, cheddar e catupiry.", 21), I("Calabresa Super", "Pão, linguiça toscana, maionese, vinagrete, ketchup, cheddar e catupiry. (TUDO EM DOBRO)", 25)] },
  { category: "Calabresa de Frango", items: [I("Frango Simples", "Pão, linguiça toscana de frango, maionese, vinagrete e ketchup.", 19), I("Frango Completo", "Pão, linguiça toscana de frango, maionese, vinagrete, ketchup, cheddar e catupiry.", 21), I("Frango Super", "Pão, linguiça toscana de frango, maionese, vinagrete, ketchup, cheddar e catupiry. (TUDO EM DOBRO)", 25)] },
  { category: "Especiais & Kids", items: [I("Dog Kids", "Pão, salsicha, maionese, ketchup, mostarda e batata palha.", 11), I("Dog Misto", "Pão, salsicha, linguiça toscana, maionese, ketchup, mostarda, purê de batata, vinagrete" + DX, 23)] },
  { category: "Batata Frita", items: [I("Batata Simples", "Só batata frita super crocante.", 14), I("Batata Completa", "Batata com catupiry e cheddar cremoso.", 16)] },
  { category: "Combos", items: [I("Combo Simples Dog", "Dog simples, batata simples, refrigerante lata ou suco.", 35), I("Combo Completo Dog", "Dog completo, batata com cheddar e catupiry, refrigerante lata ou suco.", 39), I("Combo Super Dog", "Dog super, batata com cheddar e catupiry, refrigerante lata ou suco.", 43), I("Combo Simples Calabresa", "Calabresa simples, batata simples, refrigerante lata ou suco.", 37), I("Combo Completo Calabresa", "Calabresa completo, batata com cheddar e catupiry, refrigerante lata ou suco.", 41), I("Combo Super Calabresa", "Calabresa super, batata com cheddar e catupiry, refrigerante lata ou suco.", 45), I("Combo Misto", "Dog misto, batata com cheddar e catupiry, refrigerante lata ou suco.", 43)] },
  { category: "Bebidas", items: [I("Água Mineral 500ml", "Sem gás / Com gás bem gelada.", 3), I("Refrigerante Lata 350ml", "Coca-cola, Guaraná, etc.", 7), I("Refrigerante 1L", "Garrafa família bem gelada.", 10), I("Suco 450ml", "Suco natural e refrescante.", 7), I("H2O", "Garrafa H2OH! bem gelada.", 8)] }
]; };

let S = { mode: 'open', announcement: '', menu: mk() };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms || 2800); }

function enter() {
  if ($('pin').value !== ADMIN_PIN) { $('pin').value = ''; return toast('Senha incorreta'); }
  $('login').style.display = 'none'; $('app').style.display = 'block'; load();
}

async function load() {
  try {
    const r = await fetch(CLOUD_URL + '?nocache=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    S.mode = d.mode === 'closed' ? 'closed' : 'open';
    S.announcement = d.announcement || '';
    if (Array.isArray(d.menu) && d.menu.length) S.menu = d.menu;
  } catch (e) { toast('⚠️ Não consegui ler a nuvem (' + e.message + '). Abra este arquivo pelo navegador/hospedagem e confira o CLOUD_URL.', 7000); }
  $('note').value = S.announcement; paintStore(); paintMenu();
}

function fail(why) {
  toast('❌ Não salvou: ' + why + (/404/.test(why) ? ' — crie uma nuvem em npoint.io e troque o CLOUD_URL nos dois arquivos.' : ''), 8000);
  return false;
}
async function save(msg) {
  try {
    const r = await fetch(CLOUD_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S) });
    if (!r.ok) return fail('HTTP ' + r.status);
    // confere se realmente gravou
    const c = await (await fetch(CLOUD_URL + '?nocache=' + Date.now(), { cache: 'no-store' })).json();
    if (c.mode !== S.mode || (c.announcement || '') !== (S.announcement || '')) return fail('a nuvem não aceitou a alteração');
    toast(msg || 'Salvo! ✅'); return true;
  } catch (e) { return fail('sem conexão ou acesso bloqueado (' + e.message + ')'); }
}

function paintStore() {
  const b = $('storeBtn'), open = S.mode === 'open';
  b.className = 'store ' + (open ? 'open' : 'closed');
  b.textContent = open ? '🟢 ABERTO — toque para BLOQUEAR pedidos' : '🔴 FECHADO — toque para ABRIR pedidos';
}
async function toggleStore() {
  const prev = S.mode; S.mode = prev === 'open' ? 'closed' : 'open'; paintStore();
  if (!await save(S.mode === 'open' ? 'Loja aberta para pedidos' : 'Pedidos bloqueados')) { S.mode = prev; paintStore(); }
}

function paintMenu() {
  $('menu').innerHTML = S.menu.map((c, ci) => `
    <div class="cat"><span>${esc(c.category)}</span><span><button class="btn" onclick="renameCat(${ci})">✏️</button> <button class="btn red" onclick="delCat(${ci})">🗑</button></span></div>
    ${c.items.map((it, ii) => `
      <div class="item">
        <div class="line"><input class="in" value="${esc(it.name)}" oninput="U(${ci},${ii},'name',this.value)"><input class="in" type="number" step="0.5" min="0" value="${+it.price}" oninput="U(${ci},${ii},'price',parseFloat(this.value)||0)"></div>
        <textarea class="in" oninput="U(${ci},${ii},'desc',this.value)">${esc(it.desc)}</textarea>
        <div class="line2"><label><input type="checkbox" ${it.off ? 'checked' : ''} onchange="U(${ci},${ii},'off',this.checked)"> Esgotado</label><button class="btn red" onclick="delItem(${ci},${ii})">Remover</button></div>
      </div>`).join('')}
    <button class="btn" style="margin-top:10px" onclick="addItem(${ci})">+ Novo item</button>`).join('');
}
const U = (c, i, k, v) => { S.menu[c].items[i][k] = v; };
function addItem(ci) {
  const name = prompt('Nome do item:'); if (!name) return;
  const price = parseFloat((prompt('Preço (ex: 18.50):') || '0').replace(',', '.')) || 0;
  const desc = prompt('Descrição (opcional):') || '';
  S.menu[ci].items.push({ id: Date.now(), name, desc, price, off: false }); paintMenu();
}
function delItem(c, i) { if (confirm('Remover "' + S.menu[c].items[i].name + '"?')) { S.menu[c].items.splice(i, 1); paintMenu(); } }
function addCat() { const n = prompt('Nome da categoria:'); if (n) { S.menu.push({ category: n, items: [] }); paintMenu(); } }
function renameCat(c) { const n = prompt('Novo nome:', S.menu[c].category); if (n) { S.menu[c].category = n; paintMenu(); } }
function delCat(c) { if (confirm('Remover a categoria "' + S.menu[c].category + '" e todos os itens?')) { S.menu.splice(c, 1); paintMenu(); } }
function resetMenu() { if (confirm('Voltar ao cardápio original? Suas edições serão perdidas (após salvar).')) { S.menu = mk(); paintMenu(); } }
</script>
</body>
</html>
